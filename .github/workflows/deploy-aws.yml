name: AWS_BANK manual deployment

on:
  workflow_dispatch:
    inputs:
      confirm_deployment:
        description: "Confirm this separately approved AWS deployment"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: aws-bank-development
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt -r requirements-test.txt
      - run: python -m pytest -q tests/test_artifacts.py tests/test_model_governance.py
      - run: python -m compileall -q app
      - name: Validate Compose contract
        env:
          AWS_BANK_BOOTSTRAP_PASSWORD: ci-only-placeholder-password
          AWS_BANK_SESSION_SECRET: ci-only-placeholder-session-secret
        run: docker compose -p aws_bank config --quiet

  deploy:
    needs: validate
    permissions:
      contents: read
      id-token: write
    if: ${{ inputs.confirm_deployment == true && vars.AWS_BANK_DEPLOYMENT_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: development
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-2' }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      DEPLOY_ROLE_ARN: ${{ vars.DEPLOY_ROLE_ARN }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      APPROVED_IMAGE_DIGEST: ${{ vars.APPROVED_IMAGE_DIGEST }}
      EXPECTED_AWS_ACCOUNT: '213473482400'
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment inputs before AWS writes
        run: |
          test "$AWS_REGION" = "ap-southeast-2"
          [[ "$DEPLOY_ROLE_ARN" =~ ^arn:aws:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_-]+$ ]]
          [[ "$ECR_REPOSITORY" =~ ^[a-z0-9][a-z0-9._/-]{1,255}$ ]]
          [[ "$EC2_INSTANCE_ID" =~ ^i-[0-9a-f]{8,}$ ]]
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Verify AWS identity and region after OIDC
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          test "$ACCOUNT_ID" = "$EXPECTED_AWS_ACCOUNT"
          test "$AWS_REGION" = "ap-southeast-2"
      - name: Resolve ECR registry
        id: ecr
        run: echo "registry=$(aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" --query 'repositories[0].repositoryUri' --output text | cut -d/ -f1)" >> "$GITHUB_OUTPUT"
      - name: Verify approved immutable image
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          [[ "$APPROVED_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          DIGEST=$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageDigest="$APPROVED_IMAGE_DIGEST" --query 'imageDetails[0].imageDigest' --output text)
          test "$DIGEST" = "$APPROVED_IMAGE_DIGEST"
          IMAGE="$REGISTRY/$ECR_REPOSITORY@$APPROVED_IMAGE_DIGEST"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "digest=$APPROVED_IMAGE_DIGEST" >> "$GITHUB_OUTPUT"
      - name: Deploy through Systems Manager
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          test -n "$EC2_INSTANCE_ID"
          [[ "$IMAGE" =~ ^[0-9]+\.dkr\.ecr\.ap-southeast-2\.amazonaws\.com/[a-z0-9][a-z0-9._/-]{1,255}@sha256:[0-9a-f]{64}$ ]]
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters commands="sudo /usr/local/sbin/aws-bank-deploy --image-uri '$IMAGE'" \
            --query Command.CommandId --output text)
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID"
          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" --query Status --output text)
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" --query '{status:Status,details:StatusDetails,output:StandardOutputContent}' --output json
          test "$STATUS" = "Success"
          echo "deployment_timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ) commit_sha=$GITHUB_SHA"
